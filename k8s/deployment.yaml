apiVersion: apps/v1
kind: Deployment
metadata:
  name: iris-api-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: iris-api
  template:
    metadata:
      labels:
        app: iris-api
    spec:
      containers:
      - name: iris-api
        # The image will be dynamically replaced by GitHub Actions
        image: IMAGE_PLACEHOLDER 
        ports:
        - containerPort: 8200
