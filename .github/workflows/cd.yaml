name: Continuous Deployment & Stress Testing

on:
  push:
    branches:
      - week_7

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT }}
  REGION: us-central1
  REPO_NAME: my-repo
  IMAGE_NAME: iris-api
  CLUSTER_NAME: test-iris-v1
  CLUSTER_ZONE: us-central1-a

jobs:
  build-deploy-test:
    runs-on: ubuntu-latest
    
    permissions:
      contents: 'read'
      id-token: 'write'
      
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v1
        with:
          workload_identity_provider: 'projects/${{ secrets.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions-cd@${{ secrets.GCP_PROJECT }}.iam.gserviceaccount.com'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v1
        
      - name: Configure Docker Auth
        run: gcloud auth configure-docker $REGION-docker.pkg.dev

      - name: Build and Tag Docker Image
        run: |
          docker build -t $IMAGE_NAME .
          docker tag $IMAGE_NAME $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:latest
          
      - name: Push Image to Artifact Registry
        run: |
          docker push $REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:latest

      - name: Get GKE Credentials
        uses: google-github-actions/get-gke-credentials@v1
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_ZONE }}

      - name: Deploy to GKE
        run: |
          sed -i "s|IMAGE_PLACEHOLDER|$REGION-docker.pkg.dev/$PROJECT_ID/$REPO_NAME/$IMAGE_NAME:latest|g" k8s/deployment.yaml
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/service.yaml
          kubectl apply -f k8s/hpa.yaml

      - name: Install wrk Load Tester
        run: |
          sudo apt-get update
          sudo apt-get install -y wrk

      - name: Wait for LoadBalancer IP and Run Stress Test
        run: |
          echo "Waiting for External IP..."
          until kubectl get svc iris-api-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}' | grep -q .; do
            sleep 5
          done
          
          EXTERNAL_IP=$(kubectl get svc iris-api-service -o jsonpath='{.status.loadBalancer.ingress[0].ip}')
          echo "API deployed at IP: $EXTERNAL_IP"
          
          echo "Running wrk load test..."
          wrk -t4 -c1000 -d30s -s post.lua "http://$EXTERNAL_IP/predict/"
